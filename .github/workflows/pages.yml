name: Validate and deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate public tree
        shell: python
        run: |
          import json, pathlib, re, sys
          root = pathlib.Path('.')
          required = [
              'index.html', 'status/index.html', 'releases/index.html',
              'docs/index.html', 'health/index.html', 'api/health.json',
              'api/status.json', 'api/releases.json', 'api/version.json',
              'robots.txt', 'sitemap.xml', 'SECURITY.md'
          ]
          missing = [p for p in required if not (root / p).is_file()]
          if missing:
              raise SystemExit(f'Missing required files: {missing}')
          for path in (root / 'api').glob('*.json'):
              json.loads(path.read_text(encoding='utf-8'))
          banned = re.compile(r'(BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|ghp_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9]{20,})')
          for path in root.rglob('*'):
              if path.is_file() and '.git' not in path.parts:
                  try: text = path.read_text(encoding='utf-8')
                  except UnicodeDecodeError: continue
                  if banned.search(text):
                      raise SystemExit(f'Potential secret pattern in {path}')
          print('Static validation passed.')
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

